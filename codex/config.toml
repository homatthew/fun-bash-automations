# Portable Codex configuration source-of-truth.
# This file is copied/rendered into ~/.codex/config.toml by dotfiles installers.

model = "gpt-5.5"
review_model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_provider = "openai-chat-completions"
file_opener = "cursor"
personality = "pragmatic"
model_context_window = 400000
model_auto_compact_token_limit = 350000
shell_environment_policy.inherit = "all"

[analytics]
enabled = false

[feedback]
enabled = false

[features]
hooks = true
remote_connections = true

[tui]
notifications = [ "agent-turn-complete", "approval-requested" ]
status_line = [
  "model-with-reasoning",
  "git-branch",
  "project-root",
  "context-usage",
]
terminal_title = ["spinner", "project-root", "git-branch"]

[model_providers.openai-chat-completions]
name = "Netflix Model Gateway"
base_url = "__CODEX_BASE_URL__"
env_key = "OPENAI_API_KEY"
wire_api = "responses"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.core-tools]
url = "http://ngpmcpgateway.prod.local.dev.netflix.net:9123/mcp/ngp-mcp-core_tools-gvEcka"

[mcp_servers.netflix-ci-official]
url = "http://ngpmcpgateway.prod.local.dev.netflix.net:9123/proxy-mcp/ngp-mcp-boost-stable-prod-1BH4v2"

[mcp_servers.nflx-spinnaker]
command = "npx"
args = ["-y", "@netflix-internal/mcp-server-spinnaker@latest"]

[mcp_servers.sourcegraph]
command = "npx"
args = ["-y", "@netflix-internal/mcp-server-sourcegraph"]

[mcp_servers.sourcegraph.env]
SOURCEGRAPH_URL = "https://sourcegraph.netflix.net"

[mcp_servers.sourcegraph-official]
url = "http://ngpmcpgateway.prod.local.dev.netflix.net:9123/proxy-mcp/ngp-mcp-sourcegraph-gzXzII"

[mcp_servers.NECP]
url = "http://ngpmcpgateway.prod.local.dev.netflix.net:9123/proxy-mcp/necpmcp-prod/mcp"

[mcp_servers.ndex-slack-private]
command = "__FBA_ROOT__/bin/launch-slack-mcp"

[marketplaces.ods-datastores-minimal]
source_type = "git"
source = "https://git.netflix.net/matthewho/cde-ods-skills.git"
ref = "15290c5e2fcf0908af20226d0c553cac4b2ec736"
sparse_paths = [".agents/plugins", "codex-plugins/ods-datastores-minimal"]

[plugins."ods-datastores-minimal@ods-datastores-minimal"]
enabled = true
