[project]
name = "ralph"
version = "0.1.0"
description = "Ralph Wiggum — Autonomous Claude Code Loop"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "textual>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
ralph = "ralph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ralph"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
